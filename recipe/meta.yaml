{% set name = "litellm" %}
{% set version = "1.103.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: 6138d09d1c6bdb2cb9aa2198a0aa0f248eb0b5d9fb10acf06cbff8716e3106c1

build:
  number: 0
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cd litellm-rust
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  entry_points:
    - litellm = litellm:run_server
  skip: true # [py<310 or py>314]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - pip
    - python
    - maturin ==1.15.0
  run:
    - python
    - fastuuid >=0.14.0,<1.0
    - httpx >=0.28.0,<1.0
    - h2 >=3,<5
    - openai >=2.20.0,<3.0.0
    - python-dotenv >=1.0.0,<2.0
    - tiktoken >=0.8.0,<1.0 # [py<314]
    - tiktoken >=0.12.0,<1.0 # [py>=314]
    - importlib-metadata >=8.0.0,<9.0
    - tokenizers >=0.21.0,<1.0
    - click >=8.0.0,<9.0
    - jinja2 >=3.1.6,<4.0
    - aiohttp >=3.14.2,<4.0
    - pydantic >=2.11.0,<3.0.0 # [py<314]
    - pydantic >=2.12.0,<3.0.0 # [py>=314]
    - pydantic-settings >=2.14.1,<3.0
    - boto3 >=1.43.1,<2.0
    - jsonschema >=4.0.0,<5.0
  run_constrained:
    - gunicorn >=23.0.0,<24.0
    - uvicorn >=0.33.0,<1.0
    - granian >=2.7.4,<3.0
    - uvloop >=0.22.1,<1.0  # [not win]
    - fastapi >=0.136.3,<1.0
    - starlette >=1.0.1,<2.0
    - backoff >=2.2.1,<3.0
    - pyyaml >=6.0.3,<7.0
    - rq >=2.7.0,<3.0
    - orjson >=3.11.6,<4.0
    - apscheduler >=3.11.2,<4.0
    - fastapi-sso >=0.19.0,<1.0
    - PyJWT >=2.13.0,<3.0
    - python-multipart >=0.0.27,<1.0
    - cryptography >=49.0.0,<51.0
    - pynacl >=1.6.2,<2.0
    - websockets >=15.0.1,<16.0
    - azure-identity >=1.25.2,<2.0
    - azure-storage-blob >=12.28.0,<13.0
    - mcp >=2.2.0,<3.0
    - litellm-proxy-extras ==0.4.100
    - litellm-enterprise ==0.1.69
    - RestrictedPython >=8.5,<9.0
    - rich >=13.9.4,<14.0
    - polars >=1.38.1,<2.0
    - soundfile >=0.12.1,<1.0
    - pyroscope-io >=0.8.16,<1.0  # [not win]
    - hiredis >=3.0.0,<4.0
    - httpx2 >=2.5.0,<3
    - InquirerPy >=0.3.4,<1.0
    - tomlkit >=0.13.3,<1.0
    - expression >=5.6.0,<6.0

# Tests removed: almost all of them are skipped in the end because of dependencies we don't have like fastapi_sso and others.
test:
  imports:
    - litellm
    - litellm.llms
    - litellm.proxy
    - litellm.proxy.hooks
  commands:
    - pip check
    - litellm --help
    - python -c "import litellm.rust_bridge._native"
  requires:
    - pip
    - fastapi
    - orjson

about:
  home: https://github.com/BerriAI/litellm
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - litellm-rust/THIRDPARTY.yml
  summary: Library to easily interface with LLM API providers
  description: |
    Translate inputs to provider's completion, embedding, and image_generation endpoints
    Consistent output, text responses will always be available at ['choices'][0]['message']['content']
    Retry/fallback logic across multiple deployments (e.g. Azure/OpenAI) - Router
    Track spend & set budgets per project LiteLLM Proxy Server
  dev_url: https://github.com/BerriAI/litellm
  doc_url: https://docs.litellm.ai/docs

extra:
  recipe-maintainers:
    - jan-janssen
