{% set name = "litellm" %}
{% set version = "1.83.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: e2f2cb99df2e2b2eab63f1354faa45c88dd7c8d40c18eb648afb1b349c689633
    patches:
      - 0001-remove-pinning-version.patch

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - litellm = litellm:run_server
  skip: true # [py<39]

requirements:
  host:
    - pip
    - python
    - poetry-core
    - wheel
  run:
    - python
    - fastuuid >=0.14.0
    - httpx >=0.28.1
    - openai >=2.30.0
    - python-dotenv >=1.0.1
    - tiktoken >=0.12.0
    - importlib-metadata >=8.5.0
    - tokenizers >=0.22.2
    - click >=8.1.8
    - jinja2 >=3.1.6
    - aiohttp >=3.13.5
    - pydantic >=2.12.5
    - jsonschema >=4.23.0
  run_constrained:
    - uvicorn >=0.33.0,<1.0.0
    # Removed to add py314 support
    #- uvloop >=0.21.0,<0.22.0  # [not win]
    - gunicorn >=23.0.0,<24.0.0
    - fastapi >=0.124.4,<1.0.0
    - pyyaml >=6.0.3,<7.0.0
    - orjson >=3.10.15,<4.0.0
    - apscheduler >=3.11.2,<4.0.0
    - fastapi-sso >=0.16.0,<0.17.0
    - pyjwt >=2.12.0,<3.0.0  # [py>=39]
    - python-multipart >=0.0.20
    - prisma >=0.11.0,<0.12.0
    - azure-identity >=1.25.3,<2.0.0  # [py>=39]
    - azure-keyvault-secrets >=4.10.0,<5.0.0
    - azure-storage-blob >=12.28.0,<13.0.0
    - google-cloud-kms >=2.24.2,<3.0.0
    - google-cloud-iam >=2.19.1,<3.0.0
    - google-cloud-aiplatform >=1.133.0
    - resend >=2.23.0
    - pynacl >=1.6.2,<2.0.0
    - websockets >=15.0.1,<16.0.0
    - boto3 >=1.42.80,<2.0.0
    - redisvl >=0.4.1,<0.5.0  # [py>=39 or py<314]
    - mcp >=1.26.0,<2.0.0  # [py>=310]
    - a2a-sdk >=0.3.25,<0.4.0  # [py>=310]
    - litellm-proxy-extras >=0.4.65,<0.5.0
    # Removed to add py314 support
    #- rich >=13.9.4,<14.0.0
    - litellm-enterprise >=0.1.37,<0.2.0
    - diskcache >=5.6.3,<6.0.0
    - polars >=1.39.3,<2.0.0  # [py>=310]
    - semantic-router >=0.1.12  # [py>=39 or py<314]
    - mlflow >=3.9.0  # [py>=310]
    - soundfile >=0.12.1,<1.0.0
    - pyroscope-io >=0.8.16,<0.9  # [not win]
    - grpcio >=1.80.0
    - numpydoc >=1.8.0
    - backoff >=2.2.1
    - rq >=2.7.0
    - PyJWT >=2.12.1 # [py>=39]
    - cryptography >=43.0.3

# Tests removed: almost all of them are skipped in the end because of dependencies we don't have like fastapi_sso and others.
test:
  imports:
    - litellm
    - litellm.llms
    - litellm.proxy
    - litellm.proxy.hooks
  commands:
    - pip check
    - litellm --help
  requires:
    - pip
    - fastapi

about:
  home: https://github.com/BerriAI/litellm
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Library to easily interface with LLM API providers
  description: |
    Translate inputs to provider's completion, embedding, and image_generation endpoints
    Consistent output, text responses will always be available at ['choices'][0]['message']['content']
    Retry/fallback logic across multiple deployments (e.g. Azure/OpenAI) - Router
    Track spend & set budgets per project LiteLLM Proxy Server
  dev_url: https://github.com/BerriAI/litellm
  doc_url: https://docs.litellm.ai/docs

extra:
  recipe-maintainers:
    - jan-janssen
