test:
  source_files:
    - pyproject.toml
    - litellm/tests
  imports:
    - litellm
    - litellm.proxy
    - litellm.proxy.hooks
    - litellm.llms
  commands:
    - pip check
    - litellm --help
    - export OPENAI_API_VERSION=1.40.0 # [not win]
    - export AZURE_OPENAI_API_KEY=dump_key # [not win]
    - export OPENAI_API_KEY=dump_key # [not win]
    - set OPENAI_API_VERSION=1.40.0 # [win]
    - set AZURE_OPENAI_API_KEY=dump_key # [win]
    - set OPENAI_API_KEY=dump_key # [win]
    - pytest -vvv {{ deselect_tests | join(" ") }} --ignore=litellm/tests/test_provider_specific_config.py # [py313]
    - pytest -vvv {{ deselect_tests | join(" ") }} # [py<313]
  requires:
    - pip
    - pytest
    - pytest-asyncio
    - pytest-mock
    - boto3
    - redis
    - fastapi
    - apscheduler
    - cryptography # [py<313]
    - orjson
    - PyJWT
    - python-multipart
    - opentelemetry-api
    - opentelemetry-sdk
    - opentelemetry-exporter-otlp
    - backoff
    - anthropic
    - tenacity
    - google-cloud-storage
    - google-auth

about:
  summary: Library to easily interface with LLM API providers
  home: https://github.com/BerriAI/litellm
  license: MIT
  license_file: LICENSE
  license_family: MIT
  description: |
    Translate inputs to provider's completion, embedding, and image_generation endpoints
    Consistent output, text responses will always be available at ['choices'][0]['message']['content']
    Retry/fallback logic across multiple deployments (e.g. Azure/OpenAI) - Router
    Track spend & set budgets per project LiteLLM Proxy Server
  dev_url: https://github.com/BerriAI/litellm
  doc_url: https://docs.litellm.ai/docs

extra:
  recipe-maintainers:
    - jan-janssen
