test:
  source_files:
    - pyproject.toml
    - gh_src/tests
  imports:
    - litellm
    - litellm.llms
    - litellm.proxy
    - litellm.proxy.hooks
  commands:
    - pip check
    - litellm --help
    - pytest -vvv gh_src/tests/test_litellm {{ ignore_tests }} {{ deselect_tests }}  # [not win]
  requires:
    - pip
    - pytest
    - pytest-mock
    - pytest-asyncio
    - boto3
    - redis
    - fastapi
    - apscheduler
    - orjson
    - PyJWT
    - python-multipart
    - opentelemetry-api
    - opentelemetry-sdk
    - opentelemetry-exporter-otlp
    - backoff
    - anthropic
    - tenacity
    - google-cloud-storage
    - google-auth
    - email-validator
    - langchain-openai
    - mistralai
    - uvicorn
    - polars
    - rich
    - mcp

about:
  home: https://github.com/BerriAI/litellm
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Library to easily interface with LLM API providers
  description: |
    Translate inputs to provider's completion, embedding, and image_generation endpoints
    Consistent output, text responses will always be available at ['choices'][0]['message']['content']
    Retry/fallback logic across multiple deployments (e.g. Azure/OpenAI) - Router
    Track spend & set budgets per project LiteLLM Proxy Server
  dev_url: https://github.com/BerriAI/litellm
  doc_url: https://docs.litellm.ai/docs

extra:
  recipe-maintainers:
    - jan-janssen
