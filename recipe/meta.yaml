{% set name = "litellm" %}
{% set version = "1.43.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/BerriAI/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e0c8c89cd6ad678bbe6cbbca4541cfed42b1224107c93d0e99981e455e85cf70
  patches:
    - fix_tests.patch

build:
  entry_points:
    - litellm = litellm:run_server
  skip: true # [py<38]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - poetry-core
    - wheel
    - pip
  run:
    - python
    - openai >=1.40.0
    - python-dotenv >=0.2.0
    - tiktoken >=0.7.0
    - importlib-metadata >=6.8.0
    - tokenizers
    - click
    - jinja2 >=3.1.2,<4.0.0
    - aiohttp
    - requests >=2.31.0,<3.0.0
    - pydantic >=2.0.0,<3.0.0
    - jsonschema >=4.22.0,<5.0.0
  run_constrained:
    - uvicorn >=0.22.0,<0.23.0
    - gunicorn >=22.0.0,<23.0.0
    # Using newer version for tests (0.116.1)
    # - fastapi >=0.111.0,<0.112.0
    - backoff *
    - pyyaml >=6.0.1,<7.0.0
    - rq *
    - orjson >=3.9.7,<4.0.0
    - apscheduler >=3.10.4,<4.0.0
    - fastapi-sso >=0.10.0,<0.11.0
    - PyJWT >=2.8.0,<3.0.0
    - python-multipart >=0.0.9,<0.0.10
    - cryptography >=42.0.5,<43.0.0 # [py<313]
    - prisma 0.11.0
    - azure-identity >=1.15.0,<2.0.0
    - azure-keyvault-secrets >=4.8.0,<5.0.0
    - google-cloud-kms >=2.21.3,<3.0.0
    - resend >=0.8.0,<0.9.0
    - pynacl >=1.5.0,<2.0.0

